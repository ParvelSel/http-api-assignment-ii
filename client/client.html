<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>
    const sendGetRequest = async (page) => {
      const response = await fetch(page, {
        method: 'GET',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json' 
        },
      });
      handleGetResponse(response);
    };
    const sendPostRequest = async (page, name, age) => {
      const response = await fetch(page, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
         },
        body: JSON.stringify({ name: name, age: age })
      });
      handlePostResponse(response);
    };

    const handlePostResponse = (response) => {
      const content = document.querySelector('#content');
      content.innerHTML = `<h1>${response.id}: ${response.message}</h1>`;
    };
    const handleGetResponse = (response) => {
      const content = document.querySelector('#content');
      content.innerHTML = `<h1>${response.id}: ${response.message}</h1>`;
    };

    const init = () => {
      const nameText = document.querySelector('#nameField');
      const ageText = document.querySelector('#ageField');
      const post = () => sendPostRequest('/addUser', nameText.value, ageText.value);
      document.querySelector('#Add User').addEventListener('click', post);
      
      const page = document.querySelector('#page');
      const type = document.querySelector('#type');
      const get = () => sendGetRequest(page.value);
      document.querySelector('#Get User').addEventListener('click', get);
      sendGetRequest('/getUsers');
    };
  </script>
</head>
<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1"/>
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>
</html>
